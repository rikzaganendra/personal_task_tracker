<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app__header">
            <h1 class="app__title">Personal Task Tracker</h1>
            <p class="app__subtitle">Kelola tugas harianmu dengan mudah</p>
        </header>

        <section class="app__content">
    <form id="task-form" class="task-form">
        <input
            type="text"
            id="task-input"
            class="task-form__input"
            placeholder="Apa yang mau kamu kerjakan?"
            required
            maxlength="120"
            autocomplete="off"
        >
        <button type="submit" class="task-form__button">Tambah</button>
    </form>

    <ul id="task-list" class="task-list" aria-label="Daftar tugas"></ul>
    <p id="empty-state" class="empty-state">
        Belum ada tugas. Tambahkan tugas pertamamu!
    </p>
</section>
    </main>

    <script src="script.js"></script>
</body>
</html>
